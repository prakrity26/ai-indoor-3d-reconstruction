[project]
name = "ai-indoor-3d-reconstruction"
version = "0.1.0"
description = "Modular system for 3D scene reconstruction and spatial understanding from monocular indoor video"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24,<3",
    "opencv-python-headless>=4.9,<5",
]

# Dependencies are added only when a phase needs them.

[project.optional-dependencies]
dev = ["pytest>=8"]
depth = [
    "torch>=2.2,<3",
    "transformers>=4.41,<5",
    "pillow>=10,<12",
]
cloud = [
    "open3d>=0.18,<0.20",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["api*", "ui*", "model*", "database*", "queue*", "shared*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Open3D depends on Dash, which registers a pytest plugin that imports stdlib
# `queue`. This repo's `queue/` package would otherwise break collection.
addopts = ["-p", "no:dash"]
