[project]
name = "ai-indoor-3d-reconstruction"
version = "0.1.0"
description = "Modular system for 3D scene reconstruction and spatial understanding from monocular indoor video"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24,<3",
    "opencv-python-headless>=4.9,<5",
]

# Dependencies are added only when a phase needs them.

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["api*", "ui*", "model*", "database*", "queue*", "shared*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
