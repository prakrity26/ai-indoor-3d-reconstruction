<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Walkable indoor splat</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0d12; color: #eee; font-family: system-ui, sans-serif; overflow: hidden; }
    #hud {
      position: absolute; z-index: 2; left: 12px; top: 12px;
      padding: 12px 16px; background: rgba(0,0,0,.62); max-width: 28rem;
      border-radius: 8px; line-height: 1.4; font-size: 0.92rem;
    }
    #hud strong { display: block; margin-bottom: 6px; }
    canvas { display: block; width: 100%; height: 100%; }
    #blocker {
      display: none; position: absolute; inset: 0; z-index: 3;
      background: rgba(0,0,0,.35); align-items: center; justify-content: center;
      font-size: 1.1rem; cursor: pointer;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/",
      "@mkkellogg/gaussian-splats-3d": "https://unpkg.com/@mkkellogg/gaussian-splats-3d@0.4.7/build/gaussian-splats-3d.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="hud">
    <strong>Walkable Gaussian splat</strong>
    Click the view, then move with <b>W A S D</b>. Mouse looks around. Esc releases the mouse.
    <p id="status">Waiting for a splat PLY…</p>
    <p><input id="file" type="file" accept=".ply,.splat" /></p>
  </div>
  <div id="blocker">Click to walk</div>
  <script type="module">
    import * as GaussianSplats3D from "@mkkellogg/gaussian-splats-3d";
    import { PointerLockControls } from "three/addons/controls/PointerLockControls.js";

    const status = document.getElementById("status");
    const blocker = document.getElementById("blocker");
    const input = document.getElementById("file");
    const keys = { KeyW: false, KeyA: false, KeyS: false, KeyD: false };
    let viewer;
    let walk;
    let last = performance.now();

    function makeViewer() {
      if (viewer) {
        viewer.dispose?.();
        document.querySelector("canvas")?.remove();
      }
      viewer = new GaussianSplats3D.Viewer({
        cameraUp: [0, -1, 0],
        initialCameraPosition: [0, 0, 3],
        initialCameraLookAt: [0, 0, 0],
        sharedMemoryForWorkers: false,
        useBuiltInControls: false,
      });
      walk = new PointerLockControls(viewer.camera, document.body);
      blocker.style.display = "flex";
      blocker.onclick = () => walk.lock();
      walk.addEventListener("lock", () => { blocker.style.display = "none"; });
      walk.addEventListener("unlock", () => { blocker.style.display = "flex"; });
    }

    async function loadSplat(url) {
      status.textContent = "Loading splat…";
      makeViewer();
      await viewer.addSplatScene(url, { showLoadingUI: true, splatAlphaRemovalThreshold: 5 });
      viewer.start();
      status.textContent = "Loaded. Click the view and walk with WASD.";
    }

    document.addEventListener("keydown", (e) => { if (e.code in keys) keys[e.code] = true; });
    document.addEventListener("keyup", (e) => { if (e.code in keys) keys[e.code] = false; });

    function tick(now) {
      requestAnimationFrame(tick);
      if (!walk || !walk.isLocked) {
        last = now;
        return;
      }
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      const speed = 1.6;
      if (keys.KeyW) walk.moveForward(speed * dt);
      if (keys.KeyS) walk.moveForward(-speed * dt);
      if (keys.KeyA) walk.moveRight(-speed * dt);
      if (keys.KeyD) walk.moveRight(speed * dt);
    }
    requestAnimationFrame(tick);

    input.addEventListener("change", async () => {
      const file = input.files && input.files[0];
      if (!file) return;
      await loadSplat(URL.createObjectURL(file));
    });

    fetch("/splat.ply")
      .then((r) => r.ok ? r.blob() : null)
      .then((blob) => {
        if (!blob) return;
        status.textContent = "Found local splat. Loading…";
        return loadSplat(URL.createObjectURL(blob));
      })
      .catch(() => {});
  </script>
</body>
</html>
