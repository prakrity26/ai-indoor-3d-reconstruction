<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Walkable indoor splat</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0d12; color: #eee; font-family: system-ui, sans-serif; overflow: hidden; }
    #hud {
      position: absolute; z-index: 2; left: 12px; top: 12px;
      padding: 12px 16px; background: rgba(0,0,0,.62); max-width: 28rem;
      border-radius: 8px; line-height: 1.4; font-size: 0.92rem;
    }
    #hud strong { display: block; margin-bottom: 6px; }
    canvas { display: block; width: 100%; height: 100%; }
    #blocker {
      display: none; position: absolute; inset: 0; z-index: 3;
      background: rgba(0,0,0,.35); align-items: center; justify-content: center;
      font-size: 1.1rem; cursor: pointer;
    }
    body.embed #hud { left: 50%; right: auto; top: auto; bottom: 16px; transform: translateX(-50%); text-align: center; }
    body.embed #hud strong, body.embed #pick { display: none; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/",
      "@mkkellogg/gaussian-splats-3d": "https://unpkg.com/@mkkellogg/gaussian-splats-3d@0.4.7/build/gaussian-splats-3d.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="hud">
    <strong>Walkable Gaussian splat</strong>
    Click the view, then move with <b>W A S D</b>, <b>Q</b>/<b>E</b> for down/up. Mouse looks around. Esc releases the mouse.
    <p id="status">Waiting for a splat PLY…</p>
    <p id="pick"><input id="file" type="file" accept=".ply,.splat" /></p>
  </div>
  <div id="blocker">Click to walk</div>
  <script type="module">
    import * as GaussianSplats3D from "@mkkellogg/gaussian-splats-3d";
    import { PointerLockControls } from "three/addons/controls/PointerLockControls.js";

    const status = document.getElementById("status");
    const blocker = document.getElementById("blocker");
    const input = document.getElementById("file");
    const keys = { KeyW: false, KeyA: false, KeyS: false, KeyD: false, KeyQ: false, KeyE: false };
    let viewer;
    let walk;
    let moveSpeed = 1.6;
    let last = performance.now();

    function formatForName(name) {
      const lower = (name || "").toLowerCase();
      if (lower.endsWith(".splat")) return GaussianSplats3D.SceneFormat.Splat;
      if (lower.endsWith(".ksplat")) return GaussianSplats3D.SceneFormat.KSplat;
      return GaussianSplats3D.SceneFormat.Ply;
    }

    function percentile(values, p) {
      const sorted = Float32Array.from(values).sort();
      const i = Math.min(sorted.length - 1, Math.max(0, Math.floor(p * (sorted.length - 1))));
      return sorted[i];
    }

    function makeViewer() {
      if (viewer) {
        viewer.dispose?.();
        document.querySelector("canvas")?.remove();
      }
      viewer = new GaussianSplats3D.Viewer({
        cameraUp: [0, -1, 0],
        initialCameraPosition: [0, 0, 3],
        initialCameraLookAt: [0, 0, 0],
        sharedMemoryForWorkers: false,
        useBuiltInControls: false,
        sphericalHarmonicsDegree: 3,
      });
      window.splatViewer = viewer; // console access for debugging
      walk = new PointerLockControls(viewer.camera, document.body);
      blocker.style.display = "flex";
      blocker.onclick = () => walk.lock();
      walk.addEventListener("lock", () => { blocker.style.display = "none"; });
      walk.addEventListener("unlock", () => { blocker.style.display = "flex"; });
    }

    // Which world axis points up differs by trainer: COLMAP / the in-repo gsplat trainer use -Y,
    // Nerfstudio (splatfacto) exports use +Z. "auto" treats the thinnest axis of the room as
    // vertical and picks that trainer's sign. ?up= or setSplatUp() overrides it.
    const AXES = { "+x": [0, 1], "-x": [0, -1], "+y": [1, 1], "-y": [1, -1], "+z": [2, 1], "-z": [2, -1] };
    let stats = null;
    let resolvedUp = "-y";

    function sceneStats() {
      const count = viewer.splatMesh.getSplatCount();
      const centers = new Float32Array(count * 3);
      viewer.splatMesh.fillSplatDataArrays(null, null, null, centers, null, null, true);
      const lo = [], hi = [];
      for (let axis = 0; axis < 3; axis++) {
        const values = new Float32Array(count);
        for (let i = 0; i < count; i++) values[i] = centers[i * 3 + axis];
        lo.push(percentile(values, 0.1));
        hi.push(percentile(values, 0.9));
      }
      return { lo, hi, ext: lo.map((l, k) => Math.max(hi[k] - l, 1e-3)) };
    }

    function resolveUp(spec, ext) {
      if (AXES[spec]) return spec;
      const thinnest = ext.indexOf(Math.min(...ext));
      return ["+x", "-y", "+z"][thinnest];
    }

    function frameCamera(spec = "auto") {
      stats = stats || sceneStats();
      const { lo, hi, ext } = stats;
      resolvedUp = resolveUp(spec, ext);
      const [axis, sign] = AXES[resolvedUp];
      const extent = Math.max(...ext, 1);
      const eye = lo.map((l, k) => 0.5 * (l + hi[k]));
      const floor = sign > 0 ? lo[axis] : hi[axis];
      eye[axis] = floor + sign * 0.35 * ext[axis]; // about chest height above the floor
      const horizontal = [0, 1, 2].filter((k) => k !== axis);
      const forward = ext[horizontal[0]] >= ext[horizontal[1]] ? horizontal[0] : horizontal[1];
      const target = [...eye];
      target[forward] += extent * 0.25;
      const up = [0, 0, 0];
      up[axis] = sign;
      moveSpeed = extent * 0.18;
      viewer.camera.up.set(...up);
      viewer.camera.near = Math.max(0.02, extent / 400);
      viewer.camera.far = extent * 40;
      viewer.camera.updateProjectionMatrix();
      viewer.camera.position.set(...eye);
      viewer.camera.lookAt(...target);
      return resolvedUp;
    }

    // The studio calls this when the user flips the up axis.
    window.setSplatUp = (spec) => (viewer && viewer.splatMesh ? frameCamera(spec) : null);
    window.getSplatUp = () => resolvedUp;

    async function loadSplat(url, format) {
      status.textContent = "Loading splat…";
      makeViewer();
      try {
        await viewer.addSplatScene(url, {
          format,
          showLoadingUI: true,
          splatAlphaRemovalThreshold: 1,
        });
        stats = null;
        frameCamera(new URLSearchParams(location.search).get("up") || "auto");
        viewer.start();
        status.textContent = "Loaded. Click the view and walk with WASD.";
      } catch (err) {
        status.textContent = "Could not load this splat: " + (err && err.message ? err.message : err);
        throw err;
      }
    }

    document.addEventListener("keydown", (e) => { if (e.code in keys) keys[e.code] = true; });
    document.addEventListener("keyup", (e) => { if (e.code in keys) keys[e.code] = false; });

    function tick(now) {
      requestAnimationFrame(tick);
      if (!walk || !walk.isLocked) {
        last = now;
        return;
      }
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      if (keys.KeyW) walk.moveForward(moveSpeed * dt);
      if (keys.KeyS) walk.moveForward(-moveSpeed * dt);
      if (keys.KeyA) walk.moveRight(-moveSpeed * dt);
      if (keys.KeyD) walk.moveRight(moveSpeed * dt);
      if (keys.KeyE) viewer.camera.position.addScaledVector(viewer.camera.up, moveSpeed * dt);
      if (keys.KeyQ) viewer.camera.position.addScaledVector(viewer.camera.up, -moveSpeed * dt);
    }
    requestAnimationFrame(tick);

    input.addEventListener("change", async () => {
      const file = input.files && input.files[0];
      if (!file) return;
      try {
        await loadSplat(URL.createObjectURL(file), formatForName(file.name));
      } catch (err) {
        console.error(err);
      }
    });

    const params = new URLSearchParams(location.search);
    if (params.get("embed") === "1") document.body.classList.add("embed");
    const requested = params.get("ply") || "";
    const plyUrl = requested.startsWith("/") ? requested : "";
    if (!plyUrl) {
      status.textContent = "Drop a point_cloud.ply, or open Walk from the scene list.";
    } else {
      fetch(plyUrl)
        .then((response) => {
          if (!response.ok) {
            status.textContent = "This scene has no walkable splat yet.";
            return;
          }
          return loadSplat(plyUrl, GaussianSplats3D.SceneFormat.Ply);
        })
        .catch((err) => {
          console.error(err);
          if (status.textContent.startsWith("Loading")) {
            status.textContent = "Could not load this splat: " + (err && err.message ? err.message : err);
          }
        });
    }
  </script>
</body>
</html>
