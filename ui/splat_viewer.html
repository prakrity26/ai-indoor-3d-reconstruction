<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Indoor splat viewer</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; color: #eee; font-family: sans-serif; }
    #hud {
      position: absolute; z-index: 2; padding: 12px 16px;
      background: rgba(0,0,0,.55); max-width: 36rem;
    }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "@mkkellogg/gaussian-splats-3d": "https://unpkg.com/@mkkellogg/gaussian-splats-3d@0.4.7/build/gaussian-splats-3d.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="hud">
    <strong>Walkable splat viewer</strong> (this repository, not Captures Studio)<br />
    Load <code>data/frames/&lt;job&gt;/splat/point_cloud.ply</code> from Colab.<br />
    Orbit: drag. Pan: right-drag. Zoom: scroll.
    <p><input id="file" type="file" accept=".ply,.splat" /></p>
  </div>
  <script type="module">
    import * as GaussianSplats3D from "@mkkellogg/gaussian-splats-3d";

    const input = document.getElementById("file");
    let viewer;

    function makeViewer() {
      if (viewer) {
        viewer.dispose();
        document.querySelector("canvas")?.remove();
      }
      viewer = new GaussianSplats3D.Viewer({
        cameraUp: [0, -1, 0],
        initialCameraPosition: [0, 0, 4],
        initialCameraLookAt: [0, 0, 0],
        sharedMemoryForWorkers: false,
      });
      viewer.start();
    }

    input.addEventListener("change", async () => {
      const file = input.files && input.files[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      makeViewer();
      await viewer.addSplatScene(url, { showLoadingUI: true, splatAlphaRemovalThreshold: 5 });
    });
  </script>
</body>
</html>
