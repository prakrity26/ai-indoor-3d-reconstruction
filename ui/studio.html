<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Indoor scenes</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #07080c; color: #f4f6fb; font-family: system-ui, sans-serif; }
    body { display: flex; flex-direction: column; overflow: hidden; }
    header {
      min-height: 56px; flex: none; display: flex; align-items: center; flex-wrap: wrap; gap: 10px;
      padding: 8px 14px; background: #101218; border-bottom: 1px solid #242833;
    }
    .brand { font-weight: 680; letter-spacing: -0.02em; white-space: nowrap; }
    #scene-name { flex: 1; min-width: 0; color: #c5ccda; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    button, .upload {
      background: #1c2030; color: #f4f6fb; border: 1px solid #343848; border-radius: 999px;
      padding: 0.4rem 0.85rem; font: inherit; cursor: pointer;
    }
    button.on { background: #f4f6fb; color: #111; border-color: #f4f6fb; }
    button:disabled { opacity: 0.4; cursor: default; }
    .upload input { display: none; }
    #layout { flex: 1; min-height: 0; display: flex; }
    #rail {
      width: 280px; flex: none; background: #101218; border-right: 1px solid #242833;
      overflow: auto; padding: 10px;
    }
    #rail.closed { display: none; }
    .card {
      width: 100%; text-align: left; border-radius: 12px; margin: 0 0 8px; padding: 0.7rem 0.8rem;
      background: transparent;
    }
    .card.active { background: #1c2436; border-color: #8ea2ff; }
    .card strong { display: block; }
    .meta { color: #9aa3b5; font-size: 0.82rem; margin-top: 0.2rem; }
    .err { color: #ffb4b4; font-size: 0.82rem; margin-top: 0.25rem; }
    #stage { flex: 1; min-width: 0; position: relative; background: #07080c; }
    #view, #mesh { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #07080c; }
    #mesh.off { visibility: hidden; }
    #view[hidden] { display: none; }
    #empty, #drop {
      position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
      text-align: center; padding: 2rem; color: #c5ccda; line-height: 1.45;
    }
    #empty.show { display: flex; }
    #drop {
      z-index: 4; background: rgba(7, 8, 12, 0.72); border: 2px dashed #8ea2ff; margin: 16px;
      border-radius: 16px; pointer-events: none;
    }
    #drop.show { display: flex; }
    #hint {
      position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.55); color: #e8eefc; border-radius: 999px;
      padding: 0.45rem 0.9rem; font-size: 0.88rem; pointer-events: none; white-space: nowrap;
    }
    @media (max-width: 800px) {
      #rail { position: absolute; z-index: 5; top: 56px; bottom: 0; }
      #hint { white-space: normal; width: min(92vw, 28rem); text-align: center; }
    }
  </style>
</head>
<body>
  <header>
    <button id="toggle" type="button" aria-expanded="true">Scenes</button>
    <div class="brand">Indoor scenes</div>
    <div id="scene-name">Loading scenes…</div>
    <button id="mode-orbit" type="button">Orbit</button>
    <button id="mode-walk" type="button">Walk</button>
    <label class="upload">Upload<input id="file" type="file" accept=".mp4,.mov,.avi,.mkv,.webm,.m4v,video/*" /></label>
  </header>
  <div id="layout">
    <aside id="rail"></aside>
    <div id="stage">
      <model-viewer id="mesh" camera-controls touch-action="pan-y" interaction-prompt="none" shadow-intensity="0.6" exposure="1.05" alt="Reconstructed indoor mesh"></model-viewer>
      <iframe id="view" title="Walkable scene" hidden></iframe>
      <div id="empty"></div>
      <div id="drop">Drop an indoor video. It becomes its own scene.</div>
      <div id="hint"></div>
    </div>
  </div>
  <script>
    const rail = document.getElementById("rail");
    const view = document.getElementById("view");
    const mesh = document.getElementById("mesh");
    const empty = document.getElementById("empty");
    const drop = document.getElementById("drop");
    const hint = document.getElementById("hint");
    const nameEl = document.getElementById("scene-name");
    const orbitBtn = document.getElementById("mode-orbit");
    const walkBtn = document.getElementById("mode-walk");
    const params = new URLSearchParams(location.search);
    let jobs = [];
    let selected = params.get("scene") || "";
    let mode = params.get("mode") === "walk" ? "walk" : "orbit";
    let shown = "";

    function line(job) {
      const summary = job.summary || {};
      const bits = [job.status];
      if (summary.posed_frames != null && summary.selected_frames) {
        bits.push(summary.posed_frames + "/" + summary.selected_frames + " posed");
      }
      if (summary.mesh_vertices) bits.push(summary.mesh_vertices + " vertices");
      if (job.splat_url && summary.splat_walkable === false) bits.push("sparse splat");
      else if (job.splat_url) bits.push("walkable splat");
      else if (job.mesh_url) bits.push("mesh ready");
      return bits.join(" · ");
    }

    function choose(job) {
      if (mode === "walk" && job.splat_url) return "walk";
      if (mode === "orbit" && job.mesh_url) return "orbit";
      if (job.mesh_url) return "orbit";
      if (job.splat_url) return "walk";
      return mode;
    }

    function paint() {
      const job = jobs.find((item) => item.job_id === selected) || jobs[0];
      rail.replaceChildren(...jobs.map((item) => {
        const card = document.createElement("button");
        card.type = "button";
        card.className = "card" + (job && item.job_id === job.job_id ? " active" : "");
        const title = document.createElement("strong");
        title.textContent = item.filename || item.job_id;
        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = line(item);
        card.append(title, meta);
        if (item.error) {
          const err = document.createElement("div");
          err.className = "err";
          err.textContent = item.error;
          card.appendChild(err);
        }
        card.addEventListener("click", () => {
          selected = item.job_id;
          paint();
        });
        return card;
      }));

      if (!job) {
        nameEl.textContent = "No scenes yet";
        view.hidden = true;
        mesh.classList.add("off");
        empty.classList.add("show");
        empty.textContent = "Upload an indoor video, or drop one on this view. Distances stay relative, not metres.";
        hint.textContent = "";
        return;
      }
      selected = job.job_id;
      mode = choose(job);
      nameEl.textContent = job.filename || job.job_id;
      orbitBtn.classList.toggle("on", mode === "orbit");
      walkBtn.classList.toggle("on", mode === "walk");
      orbitBtn.disabled = !job.mesh_url;
      walkBtn.disabled = !job.splat_url;
      orbitBtn.title = job.mesh_url ? "Orbit the mesh" : "This scene has no mesh yet";
      walkBtn.title = job.splat_url
        ? (job.summary && job.summary.splat_walkable === false ? "Sparse splat, not a finished walk-through" : "Walk the splat")
        : "A walkable splat needs the GPU worker";

      const url = new URL(location.href);
      url.searchParams.set("scene", selected);
      url.searchParams.set("mode", mode);
      history.replaceState(null, "", url);

      if (mode === "orbit" && job.mesh_url) {
        showMesh(job.mesh_url);
        hint.textContent = "Drag to look around. Scroll to zoom. Distances are relative, not metres.";
      } else if (mode === "walk" && job.splat_url) {
        showFrame("/viewer?embed=1&ply=" + encodeURIComponent(job.splat_url));
        const sparse = job.summary && job.summary.splat_walkable === false;
        hint.textContent = sparse
          ? "Sparse splat. Click the scene, then use W A S D. This is not a finished walk-through."
          : "Click the scene, then use W A S D. Esc releases the mouse.";
      } else {
        view.hidden = true;
        mesh.classList.add("off");
        shown = "";
        empty.classList.add("show");
        empty.textContent = job.error || (job.status === "succeeded"
          ? "This scene finished without a mesh or a splat."
          : job.filename + " is " + job.status + ". The view opens when the worker finishes.");
        hint.textContent = "";
      }
    }

    let meshRevealed = false;
    let posterHeld = 0;
    setInterval(() => {
      if (meshRevealed || mesh.classList.contains("off") || !mesh.loaded || !mesh.shadowRoot) return;
      if (mesh.getBoundingClientRect().width < 2) return;
      const canvas = mesh.shadowRoot.querySelector("canvas");
      if (canvas && getComputedStyle(canvas).display !== "none" && canvas.getBoundingClientRect().width > 2) {
        meshRevealed = true;
        return;
      }
      const poster = mesh.shadowRoot.querySelector(".slot.poster");
      if (!poster || !poster.classList.contains("show")) return;
      posterHeld += 1;
      if (posterHeld < 8) return;
      mesh.dismissPoster();
    }, 250);

    function showMesh(src) {
      empty.classList.remove("show");
      view.hidden = true;
      shown = "";
      mesh.classList.remove("off");
      if (mesh.getAttribute("src") !== src) {
        meshRevealed = false;
        posterHeld = 0;
        mesh.setAttribute("src", src);
      }
    }

    function showFrame(src) {
      empty.classList.remove("show");
      mesh.classList.add("off");
      view.hidden = false;
      if (shown !== src) {
        shown = src;
        view.src = src;
      }
    }

    async function refresh() {
      const response = await fetch("/jobs");
      const body = await response.json();
      jobs = body.jobs || [];
      if (selected && !jobs.some((job) => job.job_id === selected) && jobs[0]) selected = jobs[0].job_id;
      paint();
    }

    async function upload(file) {
      if (!file) return;
      nameEl.textContent = "Saving " + file.name + "…";
      const data = new FormData();
      data.append("file", file, file.name);
      const response = await fetch("/jobs", { method: "POST", body: data });
      const body = await response.json();
      if (!response.ok) {
        nameEl.textContent = body.detail || "Upload failed.";
        return;
      }
      selected = body.job_id;
      await refresh();
    }

    if (window.matchMedia("(max-width: 800px)").matches) {
      rail.classList.add("closed");
      document.getElementById("toggle").setAttribute("aria-expanded", "false");
    }
    document.getElementById("toggle").addEventListener("click", () => {
      const closed = rail.classList.toggle("closed");
      document.getElementById("toggle").setAttribute("aria-expanded", String(!closed));
    });
    orbitBtn.addEventListener("click", () => { mode = "orbit"; paint(); });
    walkBtn.addEventListener("click", () => { mode = "walk"; paint(); });
    document.getElementById("file").addEventListener("change", (event) => {
      upload(event.target.files && event.target.files[0]);
      event.target.value = "";
    });

    let dragDepth = 0;
    window.addEventListener("dragenter", (event) => {
      event.preventDefault();
      dragDepth += 1;
      drop.classList.add("show");
    });
    window.addEventListener("dragover", (event) => event.preventDefault());
    window.addEventListener("dragleave", () => {
      dragDepth = Math.max(0, dragDepth - 1);
      if (dragDepth === 0) drop.classList.remove("show");
    });
    window.addEventListener("drop", (event) => {
      event.preventDefault();
      dragDepth = 0;
      drop.classList.remove("show");
      const file = event.dataTransfer && event.dataTransfer.files && event.dataTransfer.files[0];
      upload(file);
    });

    refresh();
    setInterval(refresh, 4000);
  </script>
</body>
</html>
