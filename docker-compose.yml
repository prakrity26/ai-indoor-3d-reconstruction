# Phase 0 service topology skeleton.
#
# Application images (ui, api, worker) are not built yet.
# They will be added in Phases 10–14. Do not treat commented
# services as running software.
#
# Infrastructure images are declared so the intended production
# layout is explicit: UI → API → (PostgreSQL, Redis, Worker).

name: ai-indoor-3d-reconstruction

services:
  postgres:
    image: postgres:16-alpine
    container_name: reconstruction-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reconstruction}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-reconstruction}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reconstruction} -d ${POSTGRES_DB:-reconstruction}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - reconstruction

  redis:
    image: redis:7-alpine
    container_name: reconstruction-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - reconstruction

