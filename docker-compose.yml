# Production-style stack. Each concern runs in its own container:
#
#   api             the whole web app (FastAPI, web platform, walk viewer)     :8000
#   postgres        job and project database
#   redis           wakes workers when a job arrives (optional)
#   worker          CPU mesh pipeline (Phases 1–9)
#   worker-gateway  token-protected API for remote GPU workers                 :8001  (profile: gpu)
#   gpu-worker      photoreal splat trainer on a local NVIDIA GPU                      (profile: gpu)
#
#   cp .env.example .env        # change POSTGRES_PASSWORD, set WORKER_TOKEN for the gpu profile
#   docker compose up -d --build
#   open http://localhost:8000
#   docker compose --profile gpu up -d --build   # adds the gateway and a local GPU worker
#
# Uploads, frames, meshes, splats and studio documents live in ./data on the host, shared by
# the api and worker containers. The database lives in the postgres_data volume.

name: ai-indoor-3d-reconstruction

x-app-env: &app-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-reconstruction}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-reconstruction}
  REDIS_URL: redis://redis:6379/0
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-500}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  postgres:
    image: postgres:16-alpine
    container_name: reconstruction-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reconstruction}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-reconstruction}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reconstruction} -d ${POSTGRES_DB:-reconstruction}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [reconstruction]

  redis:
    image: redis:7-alpine
    container_name: reconstruction-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [reconstruction]

  api:
    build:
      context: .
      target: api
    image: indoor3d-api:latest
    container_name: reconstruction-api
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      <<: *app-env
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
    networks: [reconstruction]

  worker:
    build:
      context: .
      target: worker
    image: indoor3d-worker:latest
    container_name: reconstruction-worker
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      api: { condition: service_healthy }
    environment:
      <<: *app-env
      COMPUTE_DEVICE: cpu
    volumes:
      - ./data:/app/data
      - model_cache:/app/.cache/huggingface
    networks: [reconstruction]

  # Remote GPU workers (Colab, rented GPUs) reach this, never the api. Start it with
  #   WORKER_TOKEN=... docker compose --profile gpu up -d worker-gateway
  # and tunnel port 8001 (cloudflared tunnel --url http://localhost:8001).
  worker-gateway:
    profiles: [gpu]
    image: indoor3d-api:latest
    build:
      context: .
      target: api
    container_name: reconstruction-worker-gateway
    restart: unless-stopped
    command: ["python", "-m", "api.worker_gateway"]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      <<: *app-env
      WORKER_TOKEN: ${WORKER_TOKEN:-}  # the gateway refuses to start without a strong token
      WORKER_GATEWAY_PORT: 8001
    ports:
      - "${WORKER_GATEWAY_PORT:-8001}:8001"
    volumes:
      - ./data:/app/data
    networks: [reconstruction]

  # Trains splats on this machine's NVIDIA GPU (needs the NVIDIA Container Toolkit). A rented
  # GPU elsewhere runs the same image with WORKER_GATEWAY_URL pointing at your tunnel instead.
  gpu-worker:
    profiles: [gpu]
    build:
      context: .
      target: gpu-worker
    image: indoor3d-gpu-worker:latest
    container_name: reconstruction-gpu-worker
    restart: unless-stopped
    depends_on:
      worker-gateway: { condition: service_started }
    environment:
      WORKER_GATEWAY_URL: http://worker-gateway:8001
      WORKER_TOKEN: ${WORKER_TOKEN:-}
      WORKER_NAME: ${WORKER_NAME:-local-gpu}
      SPLAT_TRAIN_STEPS: ${SPLAT_TRAIN_STEPS:-30000}
      SPLAT_NUM_FRAMES: ${SPLAT_NUM_FRAMES:-300}
    volumes:
      - splat_work:/work
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks: [reconstruction]

volumes:
  postgres_data:
  splat_work:
  model_cache:

networks:
  reconstruction:
    driver: bridge
